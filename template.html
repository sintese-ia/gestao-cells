<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão Cells</title>
<style>
  :root{
    /* LIGHT-FIRST, como o resto da marca (ref. On Running). O painel e lido de dia,
       no celular, no meio do trabalho — fundo claro e o que a marca usa por padrao;
       escuro era o modo de enfase, e um painel de gestao nao e enfase, e chao. */
    --void:#F6F8FA; --card:#FFFFFF; --card2:#EEF2F6; --line:#D8E0E8;
    --ink:#141C24; --ink2:#516375; --ink3:#67798B;
    /* acentos escurecidos: o ciano #4ECBDD sobre branco da ~1.9:1 e some. */
    --arc:#0E7F92; --red:#C0392B; --amb:#9A6800; --grn:#0F7A57;
    --hl:#DCEFF4;   /* realce momentaneo ao pular do mapa para a tarefa */
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    /* A cor diz a NATUREZA do trabalho, nao o assunto. E o que responde a pergunta
       que organiza o dia: isso e um clique, uma decisao, ou uma conversa? */
    --t-clique:#0E7F92; --t-decisao:#9A6800; --t-pessoas:#8046B0; --t-papelada:#33619F;
    --t-campo:#0F7A57; --t-producao:#B85520; --t-construcao:#4A5F72; --t-pesquisa:#15736A;
  }
  /* sem isto o navegador em modo escuro pinta input, select e scrollbar de escuro
     por conta propria, e o painel fica com campos pretos num fundo branco. */
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;padding:0 16px 90px;background:var(--void);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:0 auto}
  a{color:var(--arc)}
  :focus-visible{outline:2px solid var(--arc);outline-offset:2px;border-radius:2px}

  header{padding:26px 0 16px;border-bottom:1px solid var(--line);margin-bottom:20px;
    display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  h1{margin:0;font:600 15px/1 var(--mono);letter-spacing:.24em;color:var(--arc)}
  h1 small{display:block;font:400 10px/1 var(--mono);letter-spacing:.14em;color:var(--ink3);margin-top:9px}
  .stat{display:flex;gap:22px;flex-wrap:wrap}
  .stat div{text-align:right}
  .stat b{display:block;font:600 21px/1 var(--mono);font-variant-numeric:tabular-nums}
  .stat span{font:400 9px/1 var(--mono);letter-spacing:.13em;color:var(--ink3);display:block;margin-top:5px}
  .s-red b{color:var(--red)} .s-arc b{color:var(--arc)} .s-amb b{color:var(--amb)}

  h2{font:500 10px/1 var(--mono);letter-spacing:.22em;color:var(--ink2);margin:28px 0 10px;
    padding-bottom:7px;border-bottom:1px solid var(--line)}
  h2 i{font-style:normal;color:var(--ink3)}

  .box{background:var(--card);border:1px solid var(--line);border-radius:3px;margin-bottom:8px}

  /* ---- tarefa ---- */
  .t{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid rgba(216,224,232,.9);align-items:flex-start}
  .t:last-child{border-bottom:none}
  .t input[type=checkbox]{flex:none;width:17px;height:17px;margin:2px 0 0;accent-color:var(--arc);cursor:pointer}
  .t .c{flex:1;min-width:0}
  .t b{display:block;font-size:14.5px;font-weight:600}
  .t p{margin:3px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.45}
  .t.ok b{text-decoration:line-through;color:var(--ink3)}
  .t.ok p{color:var(--ink3)}
  .who{font:600 8.5px/1 var(--mono);letter-spacing:.1em;padding:3px 5px;border-radius:2px;
    flex:none;margin-top:3px}
  .w-g{background:#FBEAE8;color:var(--red)} .w-c{background:#E1F2F5;color:var(--arc)}
  .w-a{background:#FAF0DB;color:var(--amb)}

  /* ---- frente ---- */
  details.f{background:var(--card);border:1px solid var(--line);border-left:2px solid var(--ink3);
    border-radius:3px;margin-bottom:7px}
  details.f[data-e=critico]{border-left-color:var(--red)}
  details.f[data-e=andando]{border-left-color:var(--amb)}
  details.f[data-e=pronto]{border-left-color:var(--grn)}
  details.f[data-e=sem_contexto]{border-left-color:var(--ink3)}
  summary{padding:12px 15px;cursor:pointer;list-style:none;display:flex;gap:12px;align-items:baseline}
  summary::-webkit-details-marker{display:none}
  summary:hover{background:var(--card2)}
  summary .n{font:600 9.5px/1 var(--mono);color:var(--ink3);flex:none;padding-top:3px}
  summary .tt{flex:1;min-width:0}
  summary b{font-size:15px;font-weight:640}
  summary p{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
  summary .badge{font:600 8.5px/1 var(--mono);letter-spacing:.1em;padding:3px 6px;border-radius:2px;flex:none}
  .b-red{background:#FBEAE8;color:var(--red)} .b-amb{background:#FAF0DB;color:var(--amb)}
  .b-grn{background:#E3F3EB;color:var(--grn)} .b-off{background:#EEF2F6;color:var(--ink3)}
  .inner{padding:2px 15px 15px;border-top:1px solid var(--line)}
  .destrava{background:var(--card2);border-radius:3px;padding:10px 12px;margin:12px 0;font-size:13.5px;color:var(--ink2)}
  .destrava b{color:var(--ink);font-size:11px;font-family:var(--mono);letter-spacing:.12em;display:block;margin-bottom:4px}

  .sub{font:500 9.5px/1 var(--mono);letter-spacing:.16em;color:var(--ink3);margin:14px 0 7px}

  /* ---- evidência ---- */
  .ev{border-left:2px solid var(--line);padding:7px 0 7px 11px;margin-bottom:7px}
  .ev .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .ev b{font-size:13.5px;font-weight:600;flex:1;min-width:200px}
  .cf{font:600 8px/1 var(--mono);letter-spacing:.09em;padding:3px 5px;border-radius:2px;flex:none}
  .cf-confirmado{background:#E3F3EB;color:var(--grn)}
  .cf-provavel{background:#FAF0DB;color:var(--amb)}
  .cf-hipotese{background:#EEF2F6;color:var(--ink2)}
  .cf-refutado{background:#FBEAE8;color:var(--red)}
  .ev .val{font:12.5px var(--mono);color:var(--arc);margin-top:3px}
  .ev .met{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.45}
  .ev .met u{text-decoration:none;color:var(--ink2)}

  /* ---- comentário ---- */
  .cm{background:var(--card2);border-radius:3px;padding:8px 11px;margin-bottom:6px;font-size:13.5px}
  .cm i{font-style:normal;font:9.5px var(--mono);color:var(--ink3);letter-spacing:.08em;display:block;margin-bottom:3px}
  .add{display:flex;gap:7px;margin-top:9px}
  .add input{flex:1;padding:8px 11px;background:var(--void);border:1px solid var(--line);
    border-radius:3px;color:var(--ink);font-size:13.5px;font-family:inherit}
  .add button{padding:8px 15px;background:var(--card2);border:1px solid var(--line);border-radius:3px;
    color:var(--arc);font:600 12px/1 var(--mono);letter-spacing:.08em;cursor:pointer}
  .add button:hover{background:var(--arc);color:var(--void);border-color:var(--arc)}

  /* ---- abas ---- */
  nav.abas{display:flex;gap:4px;margin:0 0 4px;flex-wrap:wrap}
  nav.abas button{background:var(--card);border:1px solid var(--line);border-radius:3px;
    color:var(--ink3);font:600 10px/1 var(--mono);letter-spacing:.16em;padding:9px 14px;cursor:pointer}
  nav.abas button:hover{color:var(--ink2);border-color:var(--ink3)}
  nav.abas button.on{background:var(--arc);color:var(--void);border-color:var(--arc)}
  .filtro{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:14px 0 4px;
    font:10px var(--mono);letter-spacing:.12em;color:var(--ink3)}
  .filtro label{display:flex;gap:6px;align-items:center;cursor:pointer}
  .filtro input{accent-color:var(--arc);cursor:pointer}

  /* ---- legenda ---- */
  .leg{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 16px}
  .leg span{font:600 8.5px/1 var(--mono);letter-spacing:.11em;padding:5px 8px;border-radius:2px;
    border:1px solid currentColor;opacity:.9}

  /* ---- mapa: organograma chaveado ---- */
  .mapa{display:flex;flex-direction:column;gap:9px}
  .no{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ink3);
    border-radius:3px;padding:0}
  .no[data-e=critico]{border-left-color:var(--red)}
  .no[data-e=andando]{border-left-color:var(--amb)}
  .no[data-e=pronto]{border-left-color:var(--grn)}
  .no[data-e=pausado],.no[data-e=sem_contexto]{border-left-color:var(--ink3)}
  .no>.cab{display:flex;gap:11px;align-items:baseline;padding:12px 15px;
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .no>.cab .n{font:600 9.5px/1 var(--mono);color:var(--ink3);flex:none}
  .no>.cab b{font-size:14.5px;font-weight:640;flex:1;min-width:140px}
  .no>.cab .qt{font:600 9px/1 var(--mono);letter-spacing:.1em;color:var(--ink3);flex:none}
  .ramos{padding:4px 15px 13px}
  /* o "chaveado": um tronco vertical e um traco horizontal por ramo */
  .ramo{position:relative;padding:9px 0 9px 22px}
  .ramo::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:1px;background:var(--line)}
  .ramo:last-child::before{bottom:auto;height:19px}
  .ramo::after{content:'';position:absolute;left:5px;top:19px;width:12px;height:1px;background:var(--line)}
  .ramo>.rot{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .ramo>.rot .pt{width:7px;height:7px;border-radius:50%;flex:none;background:currentColor}
  .ramo>.rot .nm{font:600 9px/1 var(--mono);letter-spacing:.15em}
  .ramo>.rot .ct{font:600 9px/1 var(--mono);color:var(--ink3)}
  .folhas{display:flex;flex-direction:column;gap:3px}
  .folha{display:flex;gap:9px;align-items:baseline;padding:5px 9px;border-radius:2px;
    background:var(--card2);border-left:2px solid currentColor;cursor:pointer;text-align:left;
    width:100%;font:inherit;color:inherit;border-top:0;border-right:0;border-bottom:0}
  .folha:hover{background:#E8EEF4}
  /* BU — o nível que faltava */
  .bu{margin:22px 0 8px}
  .bu-cab{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;
          border:1px solid var(--line);background:var(--card)}
  .bu-cab .bu-pt{width:11px;height:11px;border-radius:3px;flex:none}
  .bu-cab b{font-size:13px;letter-spacing:.10em}
  .bu-cab em{font-style:normal;font-size:11.5px;color:var(--ink3);flex:1}
  .bu-cab .qt{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .bu-corpo{margin-left:13px;padding-left:15px;border-left:2px solid var(--line)}
  .selbu{font:inherit;font-size:11px;padding:2px 5px;border:1px solid var(--line);
         border-radius:6px;background:var(--card);color:var(--ink2)}
  /* pausa e peso */
  .pw{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px 12px 52px;
      border-bottom:1px solid var(--line);background:var(--card2)}
  .pw label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
  .pw select{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);
             border-radius:6px;background:var(--card);color:var(--ink)}
  .alerta-peso{font-size:11px;color:var(--amb);font-weight:600}
  .espera{padding:10px 14px 12px 52px;border-bottom:1px solid var(--line);background:#FAF0DB}
  .espera b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--amb)}
  .espera p{margin:4px 0 0;font-size:12.5px;color:var(--ink2)}
  .fpausa{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .fpausa input[type=text]{flex:1 1 260px;font:inherit;font-size:12.5px;padding:6px 8px;
    border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
  .fpausa input[type=date]{font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);
    border-radius:6px;background:var(--card);color:var(--ink)}
  .folha .fid{font:600 9px/1.5 var(--mono);color:var(--ink3);flex:none}
  .folha .ftx{font-size:13px;color:var(--ink);flex:1;min-width:0}
  .folha .fp{font:600 8.5px/1.5 var(--mono);flex:none;letter-spacing:.08em}
  .folha.done .ftx{text-decoration:line-through;color:var(--ink3)}
  .p1{color:var(--red)} .p2{color:var(--amb)} .p3{color:var(--ink2)} .p4{color:var(--ink3)}

  /* ---- lista priorizada ---- */
  .faixa{display:flex;gap:10px;align-items:baseline;margin:22px 0 8px;
    padding-bottom:7px;border-bottom:1px solid var(--line)}
  .faixa b{font:600 11px/1 var(--mono);letter-spacing:.2em}
  .faixa span{font:400 10px/1 var(--mono);color:var(--ink3);letter-spacing:.1em}
  .faixa em{font-style:normal;font-size:12px;color:var(--ink2);flex:1;text-align:right}
  .t .chip{font:600 8px/1 var(--mono);letter-spacing:.1em;padding:3px 5px;border-radius:2px;
    flex:none;margin-top:3px;border:1px solid currentColor}
  .t .mv{display:flex;gap:2px;flex:none;margin-top:1px}
  .t .mv button{width:20px;height:20px;background:transparent;border:1px solid var(--line);
    border-radius:2px;color:var(--ink3);font:600 11px/1 var(--mono);cursor:pointer;padding:0}
  .t .mv button:hover{border-color:var(--arc);color:var(--arc)}
  .t .mv button:disabled{opacity:.25;cursor:default}

  /* ---- comentario de fechamento, dentro da tarefa ---- */
  .tc{grid-column:1/-1;margin:8px 0 2px 28px}
  .tc .cm{background:var(--void);border:1px solid var(--line);border-left:2px solid var(--grn)}
  .tc .add input{background:var(--card)}
  .tc .dica{font:9.5px var(--mono);letter-spacing:.1em;color:var(--ink3);margin-bottom:6px}
  .t{flex-wrap:wrap}
  .t .full{flex-basis:100%}

  .vazio{color:var(--ink3);font-size:13.5px;padding:12px 15px}
  #flash{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--arc);
    color:var(--void);font:600 13px system-ui;padding:9px 18px;border-radius:3px;opacity:0;
    transition:opacity .18s;pointer-events:none;z-index:9}
  #flash.on{opacity:1}
  #flash.err{background:var(--red);color:#fff}
  footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);
    font:10.5px/1.8 var(--mono);color:var(--ink3)}
  @media(max-width:620px){.stat{gap:16px}.stat b{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GESTÃO CELLS<small id="ger"></small></h1>
    <div class="stat">
      <div class="s-red"><b id="k-gab">–</b><span>AÇÃO SUA</span></div>
      <div class="s-red"><b id="k-cri">–</b><span>FRENTES CRÍTICAS</span></div>
      <div class="s-amb"><b id="k-esp">–</b><span>ESPERANDO VOCÊ</span></div>
      <div class="s-arc"><b id="k-abe">–</b><span>TAREFAS ABERTAS</span></div>
      <div id="k-wh-box"><b id="k-wh">–</b><span>ÚLT. ENTREGA DA META</span></div>
    </div>
  </header>

  <nav class="abas" id="abas">
    <button data-v="prio" class="on">PRIORIDADES</button>
    <button data-v="mapa">MAPA</button>
    <button data-v="frentes">FRENTES</button>
  </nav>

  <div class="filtro">
    <label><input type="checkbox" id="so-minhas" checked> SÓ O QUE DEPENDE DE MIM</label>
    <label><input type="checkbox" id="ver-feitas"> MOSTRAR JÁ FEITAS</label>
  </div>

  <div class="leg" id="legenda"></div>

  <!-- ============ PRIORIDADES ============ -->
  <section id="v-prio">
    <div id="listas"></div>

    <h2>ESPERANDO RESPOSTA <i id="c-esp"></i></h2>
    <div class="box" id="contatos"></div>
  </section>

  <!-- ============ MAPA ============ -->
  <section id="v-mapa" hidden>
    <div class="mapa" id="mapa"></div>
  </section>

  <!-- ============ FRENTES ============ -->
  <section id="v-frentes" hidden>
    <h2>AS FRENTES <i id="c-fr"></i></h2>
    <div id="frentes"></div>
  </section>

  <footer>
    O QUE VOCÊ MARCA AQUI É O QUE A PRÓXIMA SESSÃO DO CLAUDE VAI LER.<br>
    FONTE ÚNICA: SCHEMA <b>JARVIS</b> NO POSTGRES.
  </footer>
</div>
<div id="flash" role="status" aria-live="polite"></div>

<script>
// Os dados são injetados pelo servidor — a tela nunca recalcula regra de negócio.
const D = __DADOS__;
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c;
  if (h !== undefined) e.innerHTML = h; return e; };
const escapa = s => String(s == null ? '' : s)
  .replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

let flashT;
function flash(msg, erro) {
  const f = $('#flash'); f.textContent = msg;
  f.className = 'on' + (erro ? ' err' : '');
  clearTimeout(flashT); flashT = setTimeout(() => f.className = '', 2200);
}

// Busca a evidência de uma frente uma única vez e guarda o resultado no próprio nó.
// Se falhar, diz que falhou: sumir em silêncio faria a frente parecer sem evidência.
async function carregaEv(frenteId, zona, total) {
  if (zona.dataset.st) return;
  zona.dataset.st = 'indo';
  try {
    const r = await fetch('/api/evidencias?frente=' + frenteId);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const { evidencias } = await r.json();
    zona.textContent = '';
    evidencias.forEach(e => {
      const x = el('div', 'ev');
      x.append(el('div', 'top',
        '<b>' + escapa(e.afirmacao) + '</b>' +
        '<span class="cf cf-' + e.confianca + '">' + e.confianca.toUpperCase() + '</span>'));
      if (e.valor) x.append(el('div', 'val', escapa(e.valor)));
      x.append(el('div', 'met', '<u>' + escapa(e.fonte) + '</u> · ' + escapa(e.metodo) +
        ' · ' + escapa(e.quando) + ' por ' + escapa(e.verificado_por || '—')));
      zona.append(x);
    });
    // O teto do SELECT é 80. Sem esta linha, uma frente com 95 evidências
    // mostraria 80 e pareceria completa — corte silencioso é o que eu não quero.
    if (total && evidencias.length < total)
      zona.append(el('div', 'met',
        'mostrando ' + evidencias.length + ' de ' + total + ' — as mais recentes'));
    zona.dataset.st = 'ok';
  } catch (err) {
    zona.dataset.st = '';
    zona.innerHTML = '<div class="met">não deu para carregar a evidência — abra e feche para tentar de novo</div>';
  }
}

async function post(rota, corpo) {
  const r = await fetch(rota, { method: 'POST',
    headers: { 'content-type': 'application/json' }, body: JSON.stringify(corpo) });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.erro || ('HTTP ' + r.status)); }
  return r.json();
}

const DONO = { gabriel: ['w-g','VC'], claude: ['w-c','CL'], ambos: ['w-a','AMBOS'] };

// Tipo = natureza do trabalho. A ordem aqui e a ordem que os ramos aparecem no mapa:
// primeiro o que voce resolve sozinho em minutos, por ultimo o que e trabalho longo.
const TIPOS = {
  clique:     ['CLIQUE',     'var(--t-clique)',     'minutos, sozinho, numa conta sua'],
  decisao:    ['DECISÃO',    'var(--t-decisao)',    'so a sua resposta — eu executo'],
  pessoas:    ['PESSOAS',    'var(--t-pessoas)',    'falar com alguem'],
  papelada:   ['PAPELADA',   'var(--t-papelada)',   'nota, gateway, contador'],
  campo:      ['CAMPO',      'var(--t-campo)',      'fora do escritorio'],
  producao:   ['PRODUÇÃO',   'var(--t-producao)',   'gravar, fotografar'],
  pesquisa:   ['PESQUISA',   'var(--t-pesquisa)',   'investigar antes de decidir'],
  construcao: ['CONSTRUÇÃO', 'var(--t-construcao)', 'trabalho longo, meu'],
};
const ORDEM_TIPO = Object.keys(TIPOS);
// A DATA manda na lista. "Prioridades de hoje" = o que tem data para hoje ou
// para trás — e é tudo que ele precisa ver hoje. O resto existe no mapa e não
// cobra nada. Impacto e complexidade ordenam DENTRO da faixa, não entre faixas.
const FAIXAS = [
  ['atrasado', 'ATRASADO',    'passou da data',              t => t.dias_ate != null && t.dias_ate < 0],
  ['hoje',     'HOJE',        'é isto que você vê hoje',     t => t.dias_ate === 0],
  ['amanha',   'AMANHÃ',      'já tem dia marcado',          t => t.dias_ate === 1],
  ['semana',   'ESTA SEMANA', 'até 7 dias',                  t => t.dias_ate > 1 && t.dias_ate <= 7],
  ['depois',   'DEPOIS',      'agendado mais para frente',   t => t.dias_ate > 7],
  ['sem_data', 'SEM DATA',    'existe, mas não cobra nada hoje', t => t.dias_ate == null],
];
const NIVEL = { 1: 'baixo', 2: 'médio', 3: 'alto' };
// dentro da faixa: impacto alto primeiro; empate, o mais simples antes
const ordemDentro = (a, b) =>
  (b.impacto || 0) - (a.impacto || 0) || (a.complexidade || 9) - (b.complexidade || 9) || a.id - b.id;

// Estado da tela. Fica aqui e nao no DOM: repintar nao pode perder o filtro.
const V = { aba: 'prio', soMinhas: true, verFeitas: false };
const meu = t => t.dono === 'gabriel' || t.dono === 'ambos';
const aberta = t => t.estado === 'aberta' || t.estado === 'fazendo' || t.estado === 'bloqueada';
// Pausada NAO e aberta e NAO e feita. Fica fora das faixas P1-P4 de proposito:
// o valor de pausar e sumir do campo de visao sem sumir do mundo.
const emEspera = t => t.estado === 'em_espera';
// Alta complexidade + baixo impacto: o quadrante que o Gabriel pediu para enxergar.
const pesada = t => Number(t.complexidade) === 3 && Number(t.impacto) === 1;
const visivel = t => (V.verFeitas ? true : aberta(t)) && (V.soMinhas ? meu(t) : true);
const BADGE = { critico: ['b-red','CRÍTICO'], andando: ['b-amb','ANDANDO'],
                pronto: ['b-grn','PRONTO'], sem_contexto: ['b-off','SEM CONTEXTO'],
                pausado: ['b-off','PAUSADO'] };

function linhaTask(t) {
  const feita = t.estado === 'feita';
  const d = DONO[t.dono] || DONO.ambos;
  const div = el('div', 't' + (feita ? ' ok' : ''));
  const cb = el('input'); cb.type = 'checkbox'; cb.checked = feita;
  cb.setAttribute('aria-label', 'Concluir: ' + t.titulo);
  cb.addEventListener('change', async () => {
    cb.disabled = true;
    try {
      await post('/api/task', { id: t.id, estado: cb.checked ? 'feita' : 'aberta' });
      t.estado = cb.checked ? 'feita' : 'aberta';
      div.classList.toggle('ok', cb.checked);
      flash(cb.checked ? 'Marcado como feito' : 'Reaberto');
      // Marcar sozinho perde o COMO. Ao fechar, a caixa abre na hora e ja foca —
      // e o que voce escreve aqui e o que eu leio depois pra conferir.
      if (cb.checked) { abreComentario(t, div, true); } else { pinta(); }
    } catch (e) { cb.checked = !cb.checked; flash(e.message, true); }
    finally { cb.disabled = false; }
  });
  const tp = TIPOS[t.tipo] || TIPOS.construcao;
  const chip = el('span', 'chip', tp[0]);
  chip.style.color = tp[1];

  // As setas de P1-P4 saíram: quem manda na lista agora é a DATA, então mexer
  // em prioridade não mudaria nada na tela e seria um botão que finge trabalhar.
  // No lugar, o gesto que o modelo novo pede: "isto é de hoje".
  const mv = el('div', 'mv');
  const hoje = el('button', null, '☀');
  hoje.title = 'Marcar para hoje';
  hoje.setAttribute('aria-label', 'Marcar para hoje: ' + t.titulo);
  hoje.addEventListener('click', async () => {
    const d = new Date(); const iso = new Date(d.getTime() - d.getTimezoneOffset() * 60000)
      .toISOString().slice(0, 10);
    hoje.disabled = true;
    try {
      const r = await post('/api/data', { id: t.id, prazo: iso });
      t.prazo = r.prazo; t.data = r.data; t.dias_ate = 0;
      flash('Para hoje'); pinta();
    } catch (e) { flash(e.message, true); hoje.disabled = false; }
  });
  hoje.disabled = t.dias_ate === 0;
  const pausa = el('button', null, emEspera(t) ? '▶' : '⏸');
  pausa.title = emEspera(t) ? 'Retomar' : 'Pôr em espera';
  pausa.setAttribute('aria-label', (emEspera(t) ? 'Retomar: ' : 'Pôr em espera: ') + t.titulo);
  pausa.addEventListener('click', async () => {
    if (emEspera(t)) {
      pausa.disabled = true;
      try { await post('/api/retomar', { id: t.id });
        t.estado = 'aberta'; flash('De volta para a lista'); pinta(); }
      catch (e) { flash(e.message, true); pausa.disabled = false; }
      return;
    }
    formPausa(t, div);
  });
  mv.append(hoje, pausa);

  div.append(cb, el('span', 'who ' + d[0], d[1]), chip,
    el('div', 'c', '<b>' + escapa(t.titulo) + '</b>' +
      (t.detalhe ? '<p>' + escapa(t.detalhe) + '</p>' : '')), mv);

  if (emEspera(t)) {
    const zz = el('div', 'espera',
      '<b>Em espera' + (t.revisar ? ' · rever em ' + escapa(t.revisar) : ' · sem data de revisão') + '</b>' +
      '<p>' + escapa(t.por_que_espera || '—') + '</p>');
    div.append(zz);
  }

  // Esforço x impacto: o par que responde "isso é complexo e rende pouco?".
  // Fica sempre visível porque julgamento que exige clique para aparecer não é feito.
  const pw = el('div', 'pw');
  const mkSel = (campo, atual) => {
    const sl = document.createElement('select');
    sl.setAttribute('aria-label', campo + ' de: ' + t.titulo);
    sl.append(new Option('—', ''));
    [1, 2, 3].forEach(i => sl.append(new Option(NIVEL[i], String(i))));
    sl.value = atual == null ? '' : String(atual);
    sl.addEventListener('change', async () => {
      const antes = { complexidade: t.complexidade, impacto: t.impacto };
      t[campo] = sl.value === '' ? null : Number(sl.value);
      try {
        await post('/api/peso', { id: t.id, complexidade: t.complexidade, impacto: t.impacto });
        flash('Anotado'); pinta();
      } catch (e) { Object.assign(t, antes); flash(e.message, true); pinta(); }
    });
    return sl;
  };

  // A DATA fica junto do resto porque é ela que decide se isto aparece hoje.
  const dt = document.createElement('input');
  dt.type = 'date'; dt.value = t.prazo ? String(t.prazo).slice(0, 10) : '';
  dt.setAttribute('aria-label', 'Data de: ' + t.titulo);
  dt.addEventListener('change', async () => {
    const antes = { prazo: t.prazo, dias_ate: t.dias_ate };
    try {
      const r = await post('/api/data', { id: t.id, prazo: dt.value || null });
      t.prazo = r.prazo; t.data = r.data;
      t.dias_ate = r.prazo ? Math.round((new Date(r.prazo) - new Date(new Date().toDateString())) / 86400000) : null;
      flash(dt.value ? 'Marcado para ' + (r.data || dt.value) : 'Sem data'); pinta();
    } catch (e) { Object.assign(t, antes); flash(e.message, true); pinta(); }
  });

  pw.append(el('label', null, 'data'), dt,
            el('label', null, 'impacto'), mkSel('impacto', t.impacto),
            el('label', null, 'complexidade'), mkSel('complexidade', t.complexidade));
  if (pesada(t) && !emEspera(t))
    pw.append(el('span', 'alerta-peso', '⚠ complexa e de pouco impacto — candidata a pausa'));
  div.append(pw);

  // comentarios ja escritos nesta tarefa aparecem sempre, fechada ou nao
  const meus = D.comentarios.filter(x => x.task_id === t.id);
  if (meus.length) {
    const zona = el('div', 'tc full');
    meus.forEach(x => zona.append(el('div', 'cm',
      '<i>' + escapa(x.autor).toUpperCase() + ' · ' + escapa(x.quando) + '</i>' + escapa(x.texto))));
    div.append(zona);
  }
  // botao discreto pra comentar sem precisar fechar a tarefa
  const bc = el('button', null, meus.length ? '+ comentar' : 'comentar');
  bc.type = 'button';
  bc.style.cssText = 'background:none;border:0;color:var(--ink3);font:9.5px var(--mono);'
    + 'letter-spacing:.1em;cursor:pointer;padding:2px 0;margin-left:28px';
  bc.addEventListener('click', () => abreComentario(t, div, false));
  const rodape = el('div', 'full'); rodape.append(bc); div.append(rodape);
  return div;
}

// Caixa de comentario de uma TAREFA. Aparece ao fechar (com dica de fechamento)
// ou sob demanda. Nao repinta a tela sozinha: repintar apagaria o que voce esta digitando.
function abreComentario(t, linha, aoFechar) {
  if (linha.querySelector('.tc-add')) {
    linha.querySelector('.tc-add input').focus(); return;
  }
  const zona = el('div', 'tc tc-add full');
  if (aoFechar) zona.append(el('div', 'dica',
    'O QUE VOCÊ FEZ — E O QUE EU DEVO CONFERIR DEPOIS'));
  const box = el('div', 'add');
  const inp = el('input');
  inp.placeholder = aoFechar ? 'Ex: reconectei a credencial, confere se o fluxo voltou a rodar'
                             : 'Comentário nesta tarefa…';
  inp.setAttribute('aria-label', 'Comentário na tarefa ' + t.id);
  const bt = el('button', null, 'SALVAR');
  const enviar = async () => {
    const texto = inp.value.trim();
    if (!texto) { zona.remove(); return; }
    bt.disabled = true;
    try {
      await post('/api/comentario', { task_id: t.id, frente_id: t.frente_id, texto });
      D.comentarios.push({ frente_id: t.frente_id, task_id: t.id, autor: 'gabriel', texto,
        quando: new Date().toLocaleString('pt-BR', { day:'2-digit', month:'2-digit',
          hour:'2-digit', minute:'2-digit' }).replace(',', '') });
      flash('Comentário salvo na tarefa'); pinta();
    } catch (e) { flash(e.message, true); bt.disabled = false; }
  };
  bt.addEventListener('click', enviar);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') enviar();
    if (e.key === 'Escape') { zona.remove(); }
  });
  box.append(inp, bt); zona.append(box);
  linha.append(zona); inp.focus();
}

// ---- legenda: sem ela a cor e enfeite, nao informacao ----
function pintaLegenda() {
  const L = $('#legenda'); L.textContent = '';
  ORDEM_TIPO.forEach(k => {
    const [nome, cor, oque] = TIPOS[k];
    const s = el('span', null, nome);
    s.style.color = cor; s.title = oque;
    L.append(s);
  });
}

// ---- MAPA: frente -> ramo por tipo -> tarefa ----
// Mover subfrente de BU na própria tela. Sem isto, a divisão em BUs seria a
// MINHA leitura congelada — e quatro delas eu chutei (Human System, Gym System,
// Diário e Operação Autônoma).
function seletorBu(f) {
  const sl = document.createElement('select');
  sl.className = 'selbu';
  sl.setAttribute('aria-label', 'BU de: ' + f.nome);
  (D.bus || []).forEach(b => sl.append(new Option(b.nome, String(b.id))));
  sl.value = String(f.bu_id || '');
  sl.addEventListener('click', e => e.stopPropagation());
  sl.addEventListener('change', async () => {
    const antes = f.bu_id;
    f.bu_id = Number(sl.value);
    try { await post('/api/frente-bu', { id: f.id, bu_id: f.bu_id });
      flash(f.nome + ' → ' + sl.options[sl.selectedIndex].text); pinta(); }
    catch (e) { f.bu_id = antes; flash(e.message, true); pinta(); }
  });
  return sl;
}

function pintaMapa() {
  const M = $('#mapa'); M.textContent = '';
  let mostrou = 0;
  // BU -> subfrente -> atividade. Três níveis, como ele desenhou.
  // O tipo do trabalho não vira mais um nível: virou a cor do ponto na folha,
  // senão a árvore ficaria com quatro andares e deixaria de ser legível.
  (D.bus || []).forEach(bu => {
    const subs = D.frentes.filter(f => f.bu_id === bu.id);
    const tsBu = D.tasks.filter(t => visivel(t) && subs.some(f => f.id === t.frente_id));
    if (!tsBu.length) return;
    mostrou++;

    const cx = el('div', 'bu');
    const cab = el('div', 'bu-cab');
    const pt = el('span', 'bu-pt'); pt.style.background = bu.cor;
    cab.append(pt, el('b', null, escapa(bu.nome)), el('em', null, escapa(bu.resumo || '')),
      el('span', 'qt', tsBu.length + (tsBu.length === 1 ? ' ITEM' : ' ITENS')));
    cx.append(cab);

    const corpo = el('div', 'bu-corpo');
    subs.forEach(f => {
      const ts = D.tasks.filter(t => t.frente_id === f.id && visivel(t));
      if (!ts.length) return;
      const no = el('div', 'no'); no.dataset.e = f.estado;
      const b = BADGE[f.estado] || BADGE.pausado;
      const cf = el('div', 'cab');
      cf.append(el('span', 'n', String(f.ordem).padStart(2, '0')),
        el('b', null, escapa(f.nome)),
        el('span', 'badge ' + b[0], b[1]),
        el('span', 'qt', ts.length + (ts.length === 1 ? ' ITEM' : ' ITENS')),
        seletorBu(f));
      no.append(cf);

      const fo = el('div', 'folhas');
      ts.sort(ordemDentro).forEach(t => {
        const tp = TIPOS[t.tipo] || TIPOS.construcao;
        const lf = el('button', 'folha' + (t.estado === 'feita' ? ' done' : ''));
        lf.type = 'button';
        const bolinha = el('span', 'pt'); bolinha.style.color = tp[1];
        lf.title = tp[0] + (t.data ? ' · ' + t.data : '');
        lf.append(bolinha, el('span', 'fid', '#' + t.id), el('span', 'ftx', escapa(t.titulo)),
          el('span', 'fp p' + (t.dias_ate == null ? 4 : (t.dias_ate <= 0 ? 1 : (t.dias_ate <= 7 ? 2 : 3))),
             t.data || '—'));
        lf.addEventListener('click', () => { V.aba = 'prio'; pinta(); irPara(t.id); });
        fo.append(lf);
      });
      no.append(fo); corpo.append(no);
    });
    cx.append(corpo); M.append(cx);
  });
  if (!mostrou) M.append(el('div', 'vazio', 'Nada para mostrar com esse filtro.'));
}

function irPara(id) {
  const alvo = document.getElementById('task-' + id);
  if (!alvo) return;
  alvo.scrollIntoView({ behavior: 'smooth', block: 'center' });
  alvo.style.transition = 'background .2s';
  alvo.style.background = 'var(--hl)';   // tinta clara: no fundo branco, escuro vira mancha
  setTimeout(() => { alvo.style.background = ''; }, 1600);
}

// Pausar pede duas coisas e nao aceita menos: POR QUE e QUANDO REVER.
// Pausa sem motivo escrito e abandono com cara de decisao; pausa sem data
// e gaveta. O padrao de 14 dias existe para o campo nunca sair vazio.
function formPausa(t, div) {
  if (div.querySelector('.fpausa')) return;
  const zona = el('div', 'espera');
  zona.append(el('b', null, 'Pôr em espera'));
  const f = el('div', 'fpausa');
  const motivo = document.createElement('input');
  motivo.type = 'text'; motivo.placeholder = 'por que não agora?';
  motivo.setAttribute('aria-label', 'Motivo da pausa: ' + t.titulo);
  const quando = document.createElement('input');
  quando.type = 'date';
  quando.setAttribute('aria-label', 'Rever em: ' + t.titulo);
  const d = new Date(); d.setDate(d.getDate() + 14);
  quando.value = d.toISOString().slice(0, 10);
  const ok = el('button', 'bt', 'Pausar');
  const nao = el('button', null, 'cancelar');
  nao.addEventListener('click', () => zona.remove());
  ok.addEventListener('click', async () => {
    const txt = motivo.value.trim();
    if (txt.length < 3) { motivo.focus(); flash('Escreva o motivo', true); return; }
    ok.disabled = true;
    try {
      const r = await post('/api/espera', { id: t.id, por_que: txt, revisar_em: quando.value });
      t.estado = 'em_espera'; t.por_que_espera = txt; t.revisar = r.revisar;
      flash('Em espera' + (r.revisar ? ' até ' + r.revisar : '')); pinta();
    } catch (e) { flash(e.message, true); ok.disabled = false; }
  });
  f.append(motivo, quando, ok, nao);
  zona.append(f); div.append(zona); motivo.focus();
}

// ---- LISTA por prioridade ----
function pintaListas() {
  const L = $('#listas'); L.textContent = '';
  const ts = D.tasks.filter(visivel);
  if (!ts.length) { L.append(el('div', 'vazio', 'Nada para mostrar com esse filtro.')); return; }
  const abertas = ts.filter(t => !emEspera(t));
  FAIXAS.forEach(([slug, nome, oque, casa], i) => {
    const desse = abertas.filter(casa);
    if (!desse.length) return;
    const fx = el('div', 'faixa');
    // atrasado e hoje herdam a cor de P1/P2: é o que sangra e o que é de hoje
    const bb = el('b', null, nome); bb.className = 'p' + Math.min(4, i === 0 ? 1 : i);
    fx.append(bb, el('span', null, desse.length + ''), el('em', null, oque));
    L.append(fx);
    const cx = el('div', 'box');
    desse.sort(ordemDentro).forEach(t => { const ln = linhaTask(t); ln.id = 'task-' + t.id; cx.append(ln); });
    L.append(cx);
  });

  // Em espera fica no fim e fora das faixas: sair da frente e o ponto de pausar.
  // Mas continua na MESMA tela — gaveta em outra aba e onde trabalho vai morrer.
  const paradas = D.tasks.filter(t => emEspera(t) && (V.soMinhas ? meu(t) : true));
  if (paradas.length) {
    const vencidas = paradas.filter(t => t.dias_ate_revisar != null && t.dias_ate_revisar <= 0).length;
    const fx = el('div', 'faixa');
    const bb = el('b', null, 'EM ESPERA'); bb.className = 'p4';
    fx.append(bb, el('span', null, paradas.length + ''),
      el('em', null, vencidas ? vencidas + ' já passou da data de rever' : 'pausadas de propósito, com data para voltar'));
    L.append(fx);
    const cx = el('div', 'box');
    paradas.sort((a, b) => (a.dias_ate_revisar ?? 9999) - (b.dias_ate_revisar ?? 9999))
      .forEach(t => { const ln = linhaTask(t); ln.id = 'task-' + t.id; cx.append(ln); });
    L.append(cx);
  }
}

function caixaComentario(frenteId) {
  const box = el('div', 'add');
  const inp = el('input');
  inp.placeholder = 'Escrever um comentário…';
  inp.setAttribute('aria-label', 'Comentário');
  const bt = el('button', null, 'ENVIAR');
  const enviar = async () => {
    const texto = inp.value.trim(); if (!texto) return;
    bt.disabled = true;
    try {
      await post('/api/comentario', { frente_id: frenteId, texto });
      D.comentarios.push({ frente_id: frenteId, autor: 'gabriel', texto,
        quando: new Date().toLocaleString('pt-BR', { day:'2-digit', month:'2-digit',
          hour:'2-digit', minute:'2-digit' }).replace(',', '') });
      inp.value = ''; flash('Comentário salvo'); pinta();
    } catch (e) { flash(e.message, true); } finally { bt.disabled = false; }
  };
  bt.addEventListener('click', enviar);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });
  box.append(inp, bt);
  return box;
}

function pinta() {
  $('#ger').textContent = 'ATUALIZADO ' + D.gerado;
  const abertas = aberta;
  const minhas  = D.tasks.filter(t => t.dono === 'gabriel' && abertas(t));
  const pend    = D.contatos.filter(c => !c.respondido);

  $('#k-gab').textContent = minhas.length;
  $('#k-cri').textContent = D.frentes.filter(f => f.estado === 'critico').length;
  $('#k-esp').textContent = pend.length;
  $('#k-abe').textContent = D.tasks.filter(abertas).length;
  $('#c-esp').textContent = pend.length + ' sem resposta';
  $('#c-fr').textContent  = D.frentes.length + ' no total';

  // Silêncio prolongado aqui é ambíguo — pode ser ninguém falando com a Cells, ou o
  // canal quebrado entre a Meta e o app. Mostrar a idade evita descobrir isso tarde.
  const wh = D.resumo.webhookHoras, box = $('#k-wh-box');
  $('#k-wh').textContent = D.resumo.webhookTotal === 0 ? '—'
    : (wh < 1 ? 'agora' : wh + 'h');
  box.className = (D.resumo.webhookTotal === 0 || wh >= 48) ? 's-red' : 's-arc';

  // ---- as tres visoes ----
  ['prio','mapa','frentes'].forEach(v => { $('#v-' + v).hidden = (V.aba !== v); });
  [...$('#abas').children].forEach(b => b.classList.toggle('on', b.dataset.v === V.aba));
  pintaLegenda();
  pintaListas();
  pintaMapa();

  // ---- contatos ----
  const C = $('#contatos'); C.textContent = '';
  if (!D.contatos.length) C.append(el('div', 'vazio', 'Nenhum contato registrado ainda.'));
  D.contatos.forEach(c => {
    const div = el('div', 't' + (c.respondido ? ' ok' : ''));
    const cb = el('input'); cb.type = 'checkbox'; cb.checked = !!c.respondido;
    cb.setAttribute('aria-label', 'Marcar respondido: ' + c.quem);
    cb.addEventListener('change', async () => {
      cb.disabled = true;
      try {
        await post('/api/contato', { id: c.id, respondido: cb.checked });
        c.respondido = cb.checked; flash(cb.checked ? 'Marcado como respondido' : 'Reaberto'); pinta();
      } catch (e) { cb.checked = !cb.checked; flash(e.message, true); }
      finally { cb.disabled = false; }
    });
    const canal = (c.canal || '').replace('instagram_dm', 'DM')
      .replace('instagram_comentario', 'comentário IG').replace('_', ' ');
    div.append(cb, el('span', 'who w-a', canal.toUpperCase().slice(0, 9)),
      el('div', 'c', '<b>' + escapa(c.quem) + '</b><p>' +
        escapa(c.ultima_msg_resumo || '') +
        (c.dias != null ? ' · há ' + c.dias + ' dias' : '') + '</p>'));
    C.append(div);
  });

  // ---- frentes ----
  const F = $('#frentes'); const abertos = new Set(
    [...F.querySelectorAll('details[open]')].map(d => d.dataset.slug));
  F.textContent = '';
  D.frentes.forEach(f => {
    const b = BADGE[f.estado] || BADGE.pausado;
    const d = el('details', 'f'); d.dataset.e = f.estado; d.dataset.slug = f.slug;
    if (abertos.has(f.slug)) d.open = true;

    const s = el('summary');
    s.append(el('span', 'n', String(f.ordem).padStart(2, '0')),
      el('div', 'tt', '<b>' + escapa(f.nome) + '</b><p>' + escapa(f.resumo || '') + '</p>'),
      el('span', 'badge ' + b[0], f.dias_parada != null ? f.dias_parada + 'D PARADA' : b[1]));
    d.append(s);

    const inner = el('div', 'inner');
    if (f.o_que_destrava)
      inner.append(el('div', 'destrava', '<b>O QUE DESTRAVA</b>' + escapa(f.o_que_destrava)));

    const ts = D.tasks.filter(t => t.frente_id === f.id);
    if (ts.length) {
      inner.append(el('div', 'sub', 'TAREFAS'));
      const cx = el('div', 'box'); ts.forEach(t => cx.append(linhaTask(t))); inner.append(cx);
    }

    // A evidência não vem mais na carga inicial: ela era 274 KB de 480 KB e
    // aparece só aqui dentro. Agora chega quando a frente é aberta, uma vez só.
    if (f.n_evidencias) {
      inner.append(el('div', 'sub', 'O QUE SE SABE — E COMO'));
      const zona = el('div', 'evz',
        '<div class="met">' + f.n_evidencias + ' evidência(s) — abra para carregar</div>');
      inner.append(zona);
      const puxa = () => { if (d.open) carregaEv(f.id, zona, f.n_evidencias); };
      d.addEventListener('toggle', puxa);
      if (d.open) puxa();
    }

    const cms = D.comentarios.filter(c => c.frente_id === f.id);
    inner.append(el('div', 'sub', 'COMENTÁRIOS'));
    cms.forEach(c => inner.append(el('div', 'cm',
      '<i>' + escapa(c.autor).toUpperCase() + ' · ' + escapa(c.quando) + '</i>' + escapa(c.texto))));
    inner.append(caixaComentario(f.id));

    d.append(inner); F.append(d);
  });
}

$('#abas').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]'); if (!b) return;
  V.aba = b.dataset.v; pinta();
});
$('#so-minhas').addEventListener('change', e => { V.soMinhas = e.target.checked; pinta(); });
$('#ver-feitas').addEventListener('change', e => { V.verFeitas = e.target.checked; pinta(); });

pinta();
</script>
</body>
</html>
